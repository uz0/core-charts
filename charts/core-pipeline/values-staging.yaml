# Staging environment overrides
replicaCount: 2

image:
  repository: ghcr.io/uz0/core-pipeline
  tag: "latest"
  pullPolicy: Always

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: core-pipeline.staging.theedgestory.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: core-pipeline-staging-tls
      hosts:
        - core-pipeline.staging.theedgestory.org

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10

env:
  NODE_ENV: staging
  LOG_LEVEL: info

persistence:
  enabled: true
  size: 5Gi

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: true