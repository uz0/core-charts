global:
  environment: prod-dev
  domain: "theedgestory.org"
  cloudflare:
    apiTokenSecretName: "cloudflare-api-token-secret"
    tunnelSecretName: "cloudflare-tunnel-secret"
    tunnelId: "e84a7fb7abd9f6e36a9bf3f00ca4e494"

# Infrastructure services for production
infrastructure:
  # PostgreSQL configuration
  postgresql:
    enabled: true
    auth:
      postgresPassword: "StrongProdDevPassword123!"
      database: "core_proddev"
      username: "core_proddev_user"
      password: "StrongProdDevUserPassword123!"
    primary:
      persistence:
        enabled: true
        size: 50Gi
      resources:
        requests:
          memory: "2Gi"
          cpu: "1000m"
        limits:
          memory: "4Gi"
          cpu: "2000m"
      initdb:
        scripts:
          create_databases.sql: |
            CREATE DATABASE dcmaidbot_proddev;
            CREATE USER dcmaidbot_proddev_user WITH PASSWORD 'DcmaidbotProdDevPass123!';
            GRANT ALL PRIVILEGES ON DATABASE dcmaidbot_proddev TO dcmaidbot_proddev_user;
            -- Create pgvector extension
            \c core_proddev;
            CREATE EXTENSION IF NOT EXISTS pgvector;
            \c dcmaidbot_proddev;
            CREATE EXTENSION IF NOT EXISTS pgvector;

  # Redis configuration
  redis:
    enabled: true
    auth:
      enabled: true
      password: "RedisProdDevPass123!"
    master:
      persistence:
        size: 8Gi
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

  # MinIO S3 storage
  minio:
    enabled: true
    auth:
      rootUser: "minioadmin"
      rootPassword: "MinIOProdDevPass123!"
    persistence:
      size: 100Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    mode: standalone
    service:
      type: ClusterIP

# Cloudflare Tunnel configuration
cloudflareTunnel:
  enabled: true
  tunnelId: "e84a7fb7abd9f6e36a9bf3f00ca4e494"
  tunnelSecret:
    name: "cloudflare-tunnel-secret"
    namespace: "infrastructure"
  ingress:
    - hostname: "dcmaidbot.theedgestory.org"
      service: "dcmaidbot-prod-dev.dcmaidbot-prod-dev"
      port: 80
    - hostname: "grafana.theedgestory.org"
      service: "monitoring-grafana.monitoring"
      port: 80
    - hostname: "prometheus.theedgestory.org"
      service: "monitoring-prometheus.monitoring"
      port: 9090
    - service: "http_status_404"
      name: "default-service"

# Cert-Manager for SSL certificates
certManager:
  enabled: true
  clusterIssuer:
    name: "letsencrypt-prod"
    email: "admin@theedgestory.org"
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: "cloudflare-api-token-secret"
              key: "api-token"
            email: "admin@theedgestory.org"

# Monitoring
monitoring:
  prometheus:
    enabled: true
    retention: "15d"
    storage:
      size: 50Gi
    resources:
      requests:
        memory: "1Gi"
        cpu: "1000m"
      limits:
        memory: "2Gi"
        cpu: "2000m"

  grafana:
    enabled: true
    adminPassword: "GrafanaProdDevPass123!"
    persistence:
      size: 10Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

# Logging
logging:
  elasticsearch:
    enabled: false
  loki:
    enabled: true
    persistence:
      size: 30Gi
    resources:
      requests:
        memory: "1Gi"
        cpu: "1000m"
      limits:
        memory: "2Gi"
        cpu: "2000m"

# MCP Server for kubectl access
mcpK8sControl:
  enabled: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Security
networkPolicies:
  enabled: true

podSecurityPolicies:
  enabled: false

# Backup configuration
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: "7d"

# Core Application Services
corePipeline:
  prod-dev:
    enabled: true
    replicas: 2

    image:
      repository: "core-pipeline"
      tag: "latest"
      pullPolicy: Always

    service:
      type: ClusterIP
      port: 8080

    ingress:
      enabled: true
      hostname: "api.theedgestory.org"
      tls: true
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/rate-limit: "100"
        nginx.ingress.kubernetes.io/rate-limit-window: "1m"

    env:
      - name: NODE_ENV
        value: "production"
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: "database-credentials"
            key: "prod-dev-url"
      - name: REDIS_URL
        valueFrom:
          secretKeyRef:
            name: "redis-credentials"
            key: "prod-dev-url"

    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

    # Health checks
    livenessProbe:
      httpGet:
        path: "/health"
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: "/ready"
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5

    # Autoscaling
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

# DcMaidBot Configuration
dcmaidbot:
  prod-dev:
    enabled: true
    replicas: 2

    image:
      repository: "dcmaidbot"
      tag: "latest"
      pullPolicy: Always

    service:
      type: ClusterIP
      port: 80

    ingress:
      enabled: true
      hostname: "dcmaidbot.theedgestory.org"
      tls: true
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/rate-limit: "50"
        nginx.ingress.kubernetes.io/rate-limit-window: "1m"

    env:
      - name: NODE_ENV
        value: "production"
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: "dcmaidbot-secrets"
            key: "database-url"
      - name: REDIS_URL
        valueFrom:
          secretKeyRef:
            name: "redis-credentials"
            key: "prod-dev-url"
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: "dcmaidbot-secrets"
            key: "openai-api-key"
      - name: BOT_TOKEN
        valueFrom:
          secretKeyRef:
            name: "dcmaidbot-secrets"
            key: "bot-token"
      - name: ADMIN_IDS
        valueFrom:
          secretKeyRef:
            name: "dcmaidbot-secrets"
            key: "admin-ids"
      - name: NUDGE_SECRET
        valueFrom:
          secretKeyRef:
            name: "dcmaidbot-secrets"
            key: "nudge-secret"
      - name: S3_ENDPOINT
        value: "minio.infrastructure.svc.cluster.local:9000"
      - name: S3_BUCKET
        value: "dcmaidbot-prod-dev"
      - name: S3_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: "minio-credentials"
            key: "access-key"
      - name: S3_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: "minio-credentials"
            key: "secret-key"

    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

    # Health checks
    livenessProbe:
      httpGet:
        path: "/health"
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: "/ready"
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5

    # Autoscaling
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80